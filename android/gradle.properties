org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Machine has only 7GB total RAM — the Flutter template's default -Xmx8G
# heap limit alone exceeds total physical memory and crashes the daemon
# with an OOM before the build even starts. Also keep Gradle to a single
# worker so it doesn't spawn concurrent memory-hungry compile tasks.
org.gradle.parallel=false
org.gradle.workers.max=1
# agora_rtc_engine 6.3.2's native CMake config targets a platform version
# (16) older than this NDK (28.x) supports; official suppression per the
# build error's own suggested fix (app's actual minSdk is still 21+ via
# flutter.minSdkVersion, unaffected by this).
android.ndk.suppressMinSdkVersionError=21
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
